<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/search.svg" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
 <script>
  window.goatcounter = window.goatcounter || {};
  window.goatcounter.no_onload = true;
</script>
<script data-goatcounter="https://yfa.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
  window.addEventListener('load', function () {
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');

    if (query) {
      window.goatcounter.count({
        path: '/unduck?q=' + encodeURIComponent(query),
        event: true,
      });
    } else {
      window.goatcounter.count({
        path: location.pathname,
      });
    }
  });
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unduck</title>
    <meta
      name="description"
      content="A better default search engine (with bangs!)"
    />
  </head>
  <body style="background-color: transparent">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
